# Apenas PyPI neste projeto. No PowerShell: $env:PIP_CONFIG_FILE = "$PWD\pip.ini"
# ou: .\scripts\pip-pypi.ps1 install -r requirements.txt
# Salve este arquivo como UTF-8 sem BOM se o pip reclamar de "section headers".
[global]
index-url = https://pypi.org/simple
extra-index-url =
trusted-host = pypi.org
               files.pythonhosted.org
